services:
  - type: web
    name: nutriflow
    runtime: node
    branch: codex/flow-name-assistant
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: BILLING_ENABLED
        value: "false"
      - key: PHOTO_ANALYSIS_ENABLED
        value: "false"
      - key: PHOTO_ANALYSIS_DAILY_LIMIT
        value: "30"
      - key: PHOTO_ANALYSIS_MONTHLY_LIMIT
        value: "800"
      - key: OPENAI_VISION_MODEL
        value: gpt-6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://nutriflow-static.onrender.com,https://nutriflow-0yvi.onrender.com,http://localhost:5000,http://127.0.0.1:5000,http://127.0.0.1:5051"
      - key: APP_URL
        value: https://nutriflow-0yvi.onrender.com
      - key: SUPABASE_URL
        value: https://zjrfzcmcwbgnpbrtkqjw.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_PIX_AI_PLAN_ID
        sync: false
